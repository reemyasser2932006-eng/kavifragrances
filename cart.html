<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Kavi Fragrances</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">KAVI</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

   <div class="icons">

    <span onclick="window.location.href='search.html'">
        ⌕
    </span>

    <span class="cart-icon" onclick="window.location.href='cart.html'">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">

            <path d="M3 4H5L7 16H19L21 8H6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <circle cx="9" cy="20" r="1.2" fill="currentColor"/>
            <circle cx="17" cy="20" r="1.2" fill="currentColor"/>

        </svg>

        <span id="cart-count">0</span>

    </span>

</div>
</header>

<section class="cart">
    <h1>Your Cart</h1>

    <div id="cart-items"></div>

    <div class="cart-total">
        <h2>Total: LE <span id="cart-total">0</span></h2>

        <a href="checkout.html">Checkout</a>
    </div>
</section>

<script src="script.js"></script>

</body>
</html>
